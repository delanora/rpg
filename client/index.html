<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3e2723" />
    <meta
      name="description"
      content="Grimório Digital — ficha de D&D 5e e mesa de combate em tempo real."
    />
    <title>Grimório Digital — D&D 5e</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura, evitando o "flash" claro.
      (function () {
        try {
          var saved = localStorage.getItem('grimorio.theme');
          document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
